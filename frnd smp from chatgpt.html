<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Friends SMP</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Arial', sans-serif;
      background: #0d6efd; /* blue background */
      color: white;
      text-align: center;
      animation: fadeIn 2s ease-in;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .hero {
      padding: 100px 20px;
    }

    h1 {
      font-size: 3em;
      margin-bottom: 20px;
    }

    p {
      font-size: 1.2em;
      max-width: 600px;
      margin: auto;
    }

    .footer {
      margin-top: 100px;
      font-size: 0.9em;
      color: #ccc;
    }
  </style>
</head>
<body>
  <div class="hero">
    <h1>Friends SMP 👬👭🧑‍🤝‍🧑</h1>
    <p>
      Friends SMP is a fun and friendly Minecraft server made for friends to enjoy survival together. 
      It's vanilla-only, with no mods or cheats—just pure Minecraft! Build, explore, and survive 
      with others in a chill and exciting world. 👬👫👭
    </p>
  </div>
  <div class="footer">
    © 2025 Friends SMP 👬👭
  </div>
</body>
</html>
